<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>양평 산타 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="양평 산타 펜션" />
  <meta property="og:description" content="숲이 안겨주는 자연을 느낄 수 있는 양평펜션, 산타펜션 입니다. 이곳에서 일상 속 지친 몸과 마음의 피로를 풀어보세요!" />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2021/11/30/SYRhP27KFlqU.jpg" />
  <meta property="og:url" content="https://santaps.net" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="양평 산타 펜션" />
  <meta name="twitter:description" content="숲이 안겨주는 자연을 느낄 수 있는 양평펜션, 산타펜션 입니다. 이곳에서 일상 속 지친 몸과 마음의 피로를 풀어보세요!" />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2021/11/30/SYRhP27KFlqU.jpg" />
  <meta name="naver-site-verification" content="4af9e3437972315b9b5d5de6ab6830b77ad2552d" />
  <meta name="google-site-verification" content="RNeKBQarU-5EiS7LJtngUHctzCpFddU50eMr1HODEW4" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub5_1 sub_travel">
          <!-- 원본은 히어로가 슬라이더가 아니라 고정 배경이다 -->
          <div class="sub_wide_visual visual" data-nearby-hero>
            <div class="visual_box">
              <div class="visual_txt">
                <div>
                  <strong>Tour Information</strong>
                  <p data-property-caption="{name} 여행지 정보"></p>
                </div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="inner">
              <ul>
                <li class="on"><a href="./nearby-attractions.html">주변여행지</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <div class="sub_title_box">
              <p data-nearby-lead></p>
              <h3 data-nearby-title></h3>
            </div>

            <div class="travel_list inner">
              <ul data-nearby-list></ul>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->
    </div>

    <!-- 푸터는 #wrap(max-width:1920px) 밖에 둔다 — 어두운 배경이 화면 폭을 꽉 채우도록 -->
    <div id="footer-wrap"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/nearby-attractions-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
